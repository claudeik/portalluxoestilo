<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0908" />
    <meta name="color-scheme" content="dark light" />
    <title>Portal Estilo Luxo · Loja Mobile v1.0 · Curadoria Unicentro PY → BR</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <script>
      {
        const colorScheme = localStorage.getItem("color-scheme");
        if (colorScheme) {
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.content = colorScheme;
        }
      }
    </script>
  </head>
  <body class="bg-[#0A0908] text-[#F5EFE6] antialiased selection:bg-[#C9A961] selection:text-[#0A0908]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
